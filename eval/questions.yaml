# 20 questions, run against every policy. "kind: trap" questions are likely not answerable
# from a policy wording. The human labeller decides per policy in the gold file.
- {id: q01, category: waiting_period, lang: en,      kind: normal, text: "What is the waiting period for pre-existing diseases?"}
- {id: q02, category: waiting_period, lang: hinglish, kind: normal, text: "Diabetes ke liye waiting period kitna hai?"}
- {id: q03, category: waiting_period, lang: en,      kind: normal, text: "Is there a specific waiting period for cataract, knee replacement or hernia?"}
- {id: q04, category: waiting_period, lang: en,      kind: normal, text: "Is the initial 30 day waiting period applicable to accidents?"}
- {id: q05, category: limits,         lang: en,      kind: normal, text: "What is the room rent limit?"}
