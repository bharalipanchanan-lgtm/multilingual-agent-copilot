<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claviq Agent Copilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2325d366'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%23073b33'%3EC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --header: #075e54; --header-text: #ffffff; --accent: #25d366; --bg: #ece5dd;
    --me: #dcf8c6; --bot: #ffffff; --text: #111b21; --muted: #667781; --card: #f5f7f6;
    --card-border: #d4dbd8; --ok: #1f8a4c; --warn: #b26a00; --stop: #b3261e; --chip: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Noto Sans Devanagari", sans-serif;
         background: #d1d7db; color: var(--text); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: var(--bg);
         box-shadow: 0 0 24px rgba(0,0,0,.15); }
  header { background: var(--header); color: var(--header-text); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: grid; place-items: center;
            font-weight: 700; color: #073b33; flex: none; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font-size: 16px; }
  .title small { opacity: .85; font-size: 12px; }
  .cur { display: inline-block; margin-top: 3px; font-size: 12px; background: rgba(255,255,255,.16); border-radius: 10px;
         padding: 2px 8px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; white-space: normal; }
  .opt { background: #e1ece9; color: var(--header); border: 0; border-radius: 14px; padding: 5px 10px; font-size: 13px;
         font-weight: 600; cursor: pointer; font-family: inherit; }
  #chat { flex: 1; overflow-y: auto; padding: 12px 10px 4px; }
  .msg { max-width: 88%; margin: 6px 0; padding: 8px 10px 6px; border-radius: 8px; line-height: 1.4; font-size: 15px;
         box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-wrap; word-wrap: break-word; }
  .me { background: var(--me); margin-left: auto; border-top-right-radius: 0; }
  .bot { background: var(--bot); border-top-left-radius: 0; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; white-space: normal; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; margin-bottom: 6px; white-space: normal; }
  .b-ok { background: #e3f4ea; color: var(--ok); } .b-warn { background: #fff1db; color: var(--warn); }
  .b-stop { background: #fde7e5; color: var(--stop); }
  .cards { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; white-space: normal; }
  .cardc { background: var(--card); border: 1px solid var(--card-border); border-left: 4px solid var(--header);
           border-radius: 6px; padding: 7px 9px; font-size: 13px; }
  .cardc .hd { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .cardc .hd b { color: var(--text); }
  .cardc q { font-style: italic; }
  .cardc a { color: var(--header); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .cardc details { margin-top: 4px; } .cardc summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .cardc .full { font-size: 12px; color: #333; margin-top: 4px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  table.cmp { border-collapse: collapse; font-size: 12px; margin-top: 6px; width: 100%; white-space: normal; }
  table.cmp th, table.cmp td { border: 1px solid var(--card-border); padding: 4px 6px; text-align: left; vertical-align: top; }
  table.cmp th { background: var(--card); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; }
  .chip { flex: none; background: var(--chip); border: 1px solid var(--card-border); border-radius: 16px; padding: 5px 10px;
          font-size: 13px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 8px 10px 12px; }
  textarea { flex: 1; resize: none; border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; font-size: 15px; height: 42px; }
  button.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--header); color: #fff; font-size: 18px; cursor: pointer; }
  button.send:disabled { opacity: .5; }
  button.mic { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #ffffff; color: var(--header);
               font-size: 19px; cursor: pointer; flex: none; }
  button.mic.off { opacity: .45; }
  button.mic.rec { background: var(--stop); color: #fff; animation: pulse 1s infinite; }
  button.mic.busy { opacity: .6; cursor: wait; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(179,38,30,.25); } }
  .voicenote { font-size: 12px; color: var(--muted); padding: 0 16px; min-height: 0; }
  .voicenote:empty { display: none; }
  .spoken { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  .typing { color: var(--muted); font-style: italic; }
  .ref { display: inline-block; min-width: 18px; padding: 0 5px; margin: 0 1px; border-radius: 9px; background: #e1ece9;
         color: var(--header); font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; vertical-align: 1px; }
  .cardc.hl { box-shadow: 0 0 0 2px var(--accent); }
  details.how { margin-top: 6px; font-size: 12px; color: var(--muted); white-space: normal; }
  details.how summary { cursor: pointer; }
  details.how ul { margin: 4px 0 0 16px; padding: 0; }
  .sys { text-align: center; margin: 8px auto; font-size: 12px; color: #54656f; background: #fff8c4; padding: 4px 10px;
         border-radius: 6px; max-width: 92%; white-space: normal; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">C</div>
    <div class="title">
      <b>Claviq Agent Copilot</b>
      <small id="status">connecting...</small><br>
      <span class="cur" id="cur" title="Change policy">No policy chosen yet</span>
    </div>
  </header>
  <div id="chat">
    <div class="sys">Answers come only from the policy document you choose, with the clause and page. If the document does not say, the copilot says so.</div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="voicenote" id="vnote"></div>
  <form id="f">
    <textarea id="q" placeholder="Ask in English, Hindi or Hinglish" rows="1"></textarea>
    <button class="mic off" id="mic" type="button" aria-label="Speak your question" title="Speak your question">&#127908;</button>
    <button class="send" id="send" type="submit" aria-label="Send">&#10148;</button>
  </form>
</div>
<script>
const $ = s => document.querySelector(s);
const chat = $("#chat"), qEl = $("#q"), sendBtn = $("#send");
// The policy is chosen in the conversation ("SBI dekhna hai"), not from a list. The server says
// which policy is in use; the page only remembers it and sends it back with each question.
let currentPolicy = null, pendingQuestion = null, lastLang = null;
// Voice: the page records, our server sends the audio to the speech service with a key the
// browser never sees, and the transcript lands in the box for the agent to check before sending.
let VOICE = {enabled: false}, recorder = null, recTimer = null, voiceText = null, voiceInfo = null;
const MAX_REC_MS = 25000;
const SUGGEST = [
  "Diabetes ke liye waiting period kitna hai?",
  "What is the room rent limit?",
  "Kya ICU charges par bhi room rent ka cap lagta hai?",
  "Is maternity covered?",
  "What is the premium for a 45 year old for 10 lakh?",
  "क्या इस पॉलिसी में पहले से मौजूद बीमारियों के लिए वेटिंग पीरियड है?",
  "Compare the diabetes waiting period across policies",
];
const BADGE = {
  answered: ["b-ok", "Checked against the policy text"],
  selected: ["b-ok", "Policy document chosen"],
  choose_policy: ["b-warn", "Choose a policy document"],
  compared: ["b-ok", "From the policy fact table"],
  not_stated: ["b-warn", "Not stated in the document"],
  refused: ["b-warn", "Outside the policy wording"],
  blocked: ["b-stop", "Draft blocked: a figure did not match the policy"],
  error: ["b-stop", "Error"],
};

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function withRefs(text, id) {
  return esc(text).replace(/\[(\d+)\]/g, (m, n) => `<span class="ref" data-b="${id}" data-n="${n}">${n}</span>`);
}
const LANGN = {en: "English", hi: "Hindi", hinglish: "Hinglish"};
function howPanel(ev, meta) {
  const items = [];
  items.push(`Language detected: ${LANGN[ev.lang] || ev.lang || "?"}`);
  if (meta && meta.route) items.push(`Route: ${({single: "single policy search", compare: "comparison fact table", premium: "out of scope (premium)", hospitals: "out of scope (hospital list)", claim_status: "out of scope (claim status)"})[meta.route] || meta.route}`);
  if (ev.top_score != null) items.push(`Best clause match score: ${Number(ev.top_score).toFixed(2)}`);
  if (ev.status === "answered" && ev.backend !== "extractive") items.push("Every figure in the answer was found in the cited clause text");
  if (ev.block_reason === "polarity") items.push("Blocked: the draft said covered, but every cited clause is an exclusion");
  else if (ev.status === "blocked") items.push(`Blocked figures not found in the policy: ${(ev.unsupported_numbers || []).join(", ")}`);
  if (ev.retrieval_ms != null) items.push(`Retrieval ${ev.retrieval_ms} ms, first word ${ev.first_token_ms ?? "-"} ms, total ${ev.ms} ms`);
  if (ev._voice) items.push(`Question was spoken: transcribed by ${ev._voice.provider} in ${ev._voice.ms} ms (cloud), then ${ev._voice.edited ? "edited" : "sent as heard"}`);
  items.push(`Answered by: ${ev.backend || "-"} (runs on this laptop)`);
  return `<details class="how"><summary>How this was checked</summary><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></details>`;
}
let BID = 0;
function scroll() { chat.scrollTop = chat.scrollHeight; }
function add(cls, html) { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; chat.appendChild(d); scroll(); return d; }

function optionButtons(opts) {
  if (!opts || !opts.length) return "";
  return `<div class="opts">${opts.map(o => `<button class="opt" data-say="${esc(o.label)}" title="${esc(o.name)}">${o.n}. ${esc(o.label)}</button>`).join("")}</div>`;
}
function wireOptions(el) {
  // a tap types the insurer's name as the agent's own message, so the choice shows in the chat
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => ask(b.dataset.say));
}
async function greet() {
  let opts = [];
  try { opts = await (await fetch("/api/policies")).json(); } catch (e) {}
  const list = opts.map(o => `${o.n}. ${o.name}`).join("\n");
  const d = add("bot", `Namaste. Which policy document would you like to inspect?\nKaunsa policy document aapko dekhna hai?\n\n${esc(list)}\n\n<small>Type the insurer's name or number, for example "SBI dekhna hai". You can switch at any time.</small>` + optionButtons(opts));
  wireOptions(d);
}
function setPolicy(ev) {
  currentPolicy = ev.policy_id;
  $("#cur").textContent = `Policy: ${ev.name}`;
  const s = document.createElement("div"); s.className = "sys"; s.textContent = `Now answering from: ${ev.name}`;
  chat.appendChild(s); scroll();
  $("#chips").style.display = "";
}
const micBtn = $("#mic"), vnote = $("#vnote");
function note(t) { vnote.textContent = t || ""; }
async function setupVoice() {
  try { VOICE = await (await fetch("/api/voice")).json(); } catch (e) { VOICE = {enabled: false, reason: "Voice status unavailable."}; }
  micBtn.classList.toggle("off", !VOICE.enabled);
  micBtn.title = VOICE.enabled ? "Speak your question (tap again to stop)" : (VOICE.reason || "Voice is off");
}
async function startRec() {
  let stream;
  micBtn.classList.add("busy");
  note("Asking for microphone permission...");
  // Chrome on a Mac waits silently if macOS has not allowed it the microphone, so do not hang
  const slow = setTimeout(() => note("Still waiting for the microphone. On a Mac: System Settings > Privacy & Security > Microphone > allow your browser, then reload. You can type meanwhile."), 10000);
  try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { note("Microphone permission was not given. You can type the question."); return; }
  finally { clearTimeout(slow); micBtn.classList.remove("busy"); }
  const type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  const chunks = [];
  recorder = new MediaRecorder(stream, type ? {mimeType: type} : undefined);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearTimeout(recTimer); micBtn.classList.remove("rec");
    const blob = new Blob(chunks, {type: recorder.mimeType || type || "audio/webm"});
    recorder = null;
    await sendAudio(blob);
  };
  recorder.start();
  micBtn.classList.add("rec");
  note("Listening... tap the mic again when you finish (up to 25 seconds).");
  recTimer = setTimeout(() => recorder && recorder.state === "recording" && recorder.stop(), MAX_REC_MS);
}
async function sendAudio(blob) {
  if (!blob.size) { note("Nothing was recorded. Try again or type the question."); return; }
  micBtn.classList.add("busy"); note("Transcribing...");
  const ext = blob.type.includes("mp4") ? "m4a" : "webm";
  const fd = new FormData(); fd.append("audio", blob, `question.${ext}`);
  try {
    const r = await fetch("/api/transcribe", {method: "POST", body: fd});
    const j = await r.json();
    if (!r.ok) { note(j.detail || "Could not transcribe. Please type the question."); return; }
    qEl.value = j.text; qEl.focus();
    voiceText = j.text; voiceInfo = {provider: j.provider, ms: j.ms};
    note("Heard this. Check it, edit if needed, then press send.");
  } catch (e) { note("Could not reach the server for transcription. Please type the question."); }
  finally { micBtn.classList.remove("busy"); }
}
micBtn.onclick = () => {
  if (!VOICE.enabled) { note(VOICE.reason || "Voice is off. Please type the question."); return; }
  if (micBtn.classList.contains("busy")) return;
  if (recorder && recorder.state === "recording") recorder.stop(); else startRec();
};

async function init() {
  setupVoice();
  $("#chips").innerHTML = SUGGEST.map(s => `<span class="chip">${esc(s)}</span>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => ask(c.textContent));
  $("#chips").style.display = "none";  // suggestions appear once a policy is chosen
  $("#cur").onclick = () => ask("Which policy document can I inspect?");
  pollStatus();
  greet();
}
async function pollStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("#status").textContent = s.error ? "model error: " + s.error : s.ready ? `online · ${s.backend}` : "warming up the models...";
    if (!s.ready && !s.error) setTimeout(pollStatus, 2000);
  } catch (e) { $("#status").textContent = "offline"; setTimeout(pollStatus, 3000); }
}

function renderCards(cites, policyId, id) {
  if (!cites || !cites.length) return "";
  return `<div class="cards">` + cites.map(c => `
    <div class="cardc" id="c${id}-${c.n}">
      <div class="hd"><span>[${c.n}] <b>${esc(c.section)}</b></span>
        <a href="/pdf/${esc(c.policy_id || policyId)}#page=${c.page}" target="_blank">Page ${esc(c.printed_page)} &#8599;</a></div>
      <q>${esc(c.quote)}</q>
      ${c.text && c.text !== c.quote ? `<details><summary>Full clause</summary><div class="full">${esc(c.text)}</div></details>` : ""}
    </div>`).join("") + `</div>`;
}
function renderTable(t) {
  if (!t) return "";
  const head = `<tr><th>Policy</th>${t.attributes.map(a => `<th>${esc(a)}</th>`).join("")}</tr>`;
  const rows = t.rows.map(r => `<tr><td>${esc(r.product)}${r.verified ? "" : " <small>(unverified)</small>"}</td>${
    r.cells.map(c => `<td>${esc(c.value)}${c.printed_page ? ` <small>p${c.printed_page}</small>` : ""}</td>`).join("")}</tr>`).join("");
  return `<table class="cmp">${head}${rows}</table>`;
}

async function ask(text, held = false) {
  const question = (text ?? qEl.value).trim();
  if (!question || sendBtn.disabled) return;
  if (text === undefined) qEl.value = "";
  sendBtn.disabled = true;
  let voiced = null;
  if (voiceText !== null && text === undefined) {  // this question came from the mic
    voiced = {...voiceInfo, edited: question !== voiceText};
    voiceText = null; voiceInfo = null; note("");
  }
  if (held) {  // the agent already asked this; say it is being answered now rather than repeat it
    const s = document.createElement("div"); s.className = "sys"; s.textContent = `Answering your earlier question: ${question}`;
    chat.appendChild(s);
  } else add("me", esc(question) + (voiced ? `<div class="spoken">spoken${voiced.edited ? ", edited" : ""}</div>` : ""));
  const bubble = add("bot", `<span class="typing">checking the policy...</span>`);
  let policyId = currentPolicy, after = null;
  const t0 = performance.now();
  const id = ++BID;
  let streamed = "", meta = null;
  try {
    const resp = await fetch("/api/ask", { method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({question, policy_id: currentPolicy, held, prev_lang: lastLang}) });
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, ""); buf = buf.slice(i + 2);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "policy") { setPolicy(ev); policyId = ev.policy_id; chat.appendChild(bubble); scroll(); }
        if (ev.type === "meta") { meta = ev; if (ev.route === "single") bubble.innerHTML = `<span class="typing">reading the policy clauses...</span>`; }
        if (ev.type === "token") { streamed += ev.text; bubble.innerHTML = withRefs(streamed, id); scroll(); }
        if (ev.type === "final") {
          if (voiced) ev._voice = voiced;
          const [cls, label] = ev.block_reason === "polarity" ? ["b-stop", "Draft blocked: it called an exclusion covered"]
                                                              : (BADGE[ev.status] || BADGE.error);
          const secs = ((performance.now() - t0) / 1000).toFixed(1);
          bubble.innerHTML = `<span class="badge ${cls}">${label}</span><br>${withRefs(ev.answer, id)}` +
            renderTable(ev.table) + renderCards(ev.citations, policyId, id) + optionButtons(ev.options) +
            (["selected", "choose_policy"].includes(ev.status) ? "" : howPanel(ev, meta)) +
            `<div class="meta">${secs}s</div>`;
          wireOptions(bubble);
          if (ev.lang) lastLang = ev.lang;
          // a question asked before any policy was chosen is answered once the agent picks one
          if (ev.status === "choose_policy" && ev.pending) pendingQuestion = question;
          if (ev.status === "selected" && pendingQuestion) { after = pendingQuestion; pendingQuestion = null; }
          bubble.querySelectorAll(".ref").forEach(r => r.onclick = () => {
            const el = document.getElementById(`c${r.dataset.b}-${r.dataset.n}`);
            if (el) { el.scrollIntoView({behavior: "smooth", block: "center"}); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1500); }
          });
          scroll();
        }
      }
    }
  } catch (e) {
    bubble.innerHTML = `<span class="badge b-stop">Error</span><br>${esc(e.message)}`;
  }
  sendBtn.disabled = false; qEl.focus();
  if (after) ask(after, true);
}
$("#f").onsubmit = e => { e.preventDefault(); ask(); };
qEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
init();
</script>
</body>
</html>
